set -g default-terminal "screen-256color"
set -sa terminal-overrides ",*256*:Tc"

# Force vi mode
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g history-limit 100000

# Visual theme
set -g status-bg colour236
set -g status-fg white
set -g pane-border-style fg='#000000'
set -g pane-active-border-style fg='#6272a4'
set -g message-style bg='#44475a',fg='#8be9fd'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Auto re-number windows
set-option -g renumber-windows on

# Clear tmux buffer
bind -n C-k clear-history

# Copy-Mode buffer selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Copy-Mode buffer yanking to the platform clipboard
set -g @clipboard_command "cat >/dev/null"
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'set -g @clipboard_command "pbcopy"'
if-shell -b 'test -n "$DISPLAY" && command -v xclip >/dev/null 2>&1' 'set -g @clipboard_command "xclip -selection clipboard -in"'
if-shell -b 'test -n "$DISPLAY" && command -v xsel >/dev/null 2>&1' 'set -g @clipboard_command "xsel --clipboard --input"'
if-shell -b 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'set -g @clipboard_command "wl-copy"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clipboard_command}"

# Mouse mode
set -g mouse on
